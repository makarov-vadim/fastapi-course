services:
  postgres:
    image: postgres:18-alpine
    env_file:
      - .env.db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env.api

  test:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./tests:/app/tests
    command: pytest -v -s
    env_file:
      - .env.api


volumes:
  postgres_data:
